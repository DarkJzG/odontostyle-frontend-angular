<app-navbar-panel-paciente></app-navbar-panel-paciente>

<div class="profile-wrapper fade-in-up">
  <button class="btn-back" (click)="volver()">
    <mat-icon>arrow_back</mat-icon> Volver al Inicio
  </button>

  <div class="profile-container">
    
    <div class="profile-header">
      <div class="icon-circle"><mat-icon>manage_accounts</mat-icon></div>
      <h2>Mi Perfil</h2>
      <p>Visualiza y actualiza tu información personal de contacto.</p>
    </div>

    <div class="loading-state" *ngIf="cargando">
      <mat-icon class="spinner" style="font-size: 30px; width: 30px; height: 30px; color: #502763;">sync</mat-icon>
      <p style="margin-top: 10px;">Procesando información...</p>
    </div>

    <form [formGroup]="perfilForm" (ngSubmit)="guardarCambios()" *ngIf="!cargando" class="fade-in-up">
      
      <div class="form-grid">
        <div class="input-group">
          <label>Nombres</label>
          <div class="input-box" [class.readonly]="!esEditable">
            <input type="text" formControlName="nombres">
          </div>
        </div>

        <div class="input-group">
          <label>Apellidos</label>
          <div class="input-box" [class.readonly]="!esEditable">
            <input type="text" formControlName="apellidos">
          </div>
        </div>

        <div class="input-group">
          <label>Cédula de Identidad</label>
          <div class="input-box readonly">
            <input type="text" formControlName="cedula">
          </div>
        </div>

        <div class="input-group">
          <label>Teléfono Móvil</label>
          <div class="input-box" [class.readonly]="!esEditable">
            <input type="text" formControlName="telefono">
          </div>
        </div>

        <div class="input-group full-width">
          <label>Correo Electrónico</label>
          <div class="input-box" [class.readonly]="!esEditable">
            <input type="email" formControlName="email">
          </div>
        </div>
      </div>

      <div class="action-area">
        <button type="button" class="btn-secondary" (click)="toggleEdicion()">
          <mat-icon>{{ esEditable ? 'close' : 'edit' }}</mat-icon>
          {{ esEditable ? 'Cancelar Edición' : 'Editar Información' }}
        </button>

        <button type="submit" class="btn-primary" *ngIf="esEditable" [disabled]="perfilForm.invalid || cargando">
          <mat-icon>save</mat-icon> Guardar Cambios
        </button>
      </div>

    </form>
  </div>
</div>
